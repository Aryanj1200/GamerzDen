<style>
:root {
    --bg: #0b0d12;
    --panel: #171b25;
    --panel-2: #1e2330;
    --border: #262c3a;
    --text: #e6e8ef;
    --text-dim: #8a92a6;
    --accent: #22e0a1;
    --accent-2: #7c5cff;
    --danger: #ff5470;
    --warn: #ffb547;
    --info: #4ea1ff;
    --mono: ui-monospace, 'JetBrains Mono', Consolas, monospace;
    --sans: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    min-height: 100vh; font-size: 15px;
}
.wrap { max-width: 480px; margin: 0 auto; padding-bottom: 120px; }

.header {
    background: linear-gradient(135deg, #0f1218, #1a1d28);
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
}
.brand-row { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.logo-square {
    width: 42px; height: 42px; border-radius: 10px;
    background: #000; padding: 3px; border: 1px solid var(--border);
    display: grid; place-items: center; overflow: hidden;
}
.logo-square img { width: 100%; height: 100%; object-fit: contain; }
.brand-name { font-weight: 800; font-size: 17px; letter-spacing: .3px; }
.brand-sub { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 2px; }
.pc-tag {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(34,224,161,.12); color: var(--accent);
    padding: 6px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    margin-top: 8px; font-family: var(--mono);
}

/* Category tab bar */
.cat-bar {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 12px 20px 6px; margin: 0 -20px;
    scrollbar-width: none;
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-chip {
    flex: 0 0 auto; padding: 8px 16px; border-radius: 20px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 12px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    transition: background .15s, color .15s;
}
.cat-chip.active { background: var(--accent); color: #051610; border-color: var(--accent); }

.section-title {
    padding: 20px 20px 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1.5px; color: var(--text-dim); font-weight: 700;
}
.menu {
    padding: 0 20px; display: flex; flex-direction: column; gap: 12px;
}
.item {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px 16px;
    transition: border-color .15s;
}
.item.active { border-color: var(--accent); }
.item-top { display: flex; align-items: flex-start; gap: 12px; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 700; font-size: 15px; line-height: 1.3; }
.item-desc { color: var(--text-dim); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }
.item-partner {
    display: inline-block; margin-top: 5px; padding: 2px 8px;
    background: rgba(124,92,255,.14); color: var(--accent-2);
    border-radius: 20px; font-size: 10px; font-weight: 700;
    letter-spacing: .5px; text-transform: uppercase;
}
.item-price-simple { color: var(--text-dim); font-size: 13px; font-family: var(--mono); margin-top: 4px; font-weight: 600; }

/* Variants row */
.variants { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.variant-chip {
    padding: 7px 12px; border-radius: 10px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    min-width: 74px;
    transition: all .15s;
}
.variant-chip .v-name { text-transform: uppercase; font-size: 10.5px; letter-spacing: .8px; }
.variant-chip .v-price { font-family: var(--mono); color: var(--text); font-weight: 700; font-size: 12px; }
.variant-chip.selected {
    background: rgba(34,224,161,.14); border-color: var(--accent); color: var(--accent);
}
.variant-chip.selected .v-price { color: var(--accent); }

.item-actions { display: flex; align-items: center; justify-content: flex-end; margin-top: 10px; gap: 10px; }
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); font-size: 18px; font-weight: 700;
    display: grid; place-items: center; cursor: pointer;
    transition: background .1s;
}
.qty-btn:active { background: var(--accent); color: #051610; }
.qty-btn.add { background: var(--accent); color: #051610; border-color: var(--accent); }
.qty-num { font-family: var(--mono); font-weight: 700; min-width: 20px; text-align: center; font-size: 15px; }

.bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(11,13,18,.95); backdrop-filter: blur(10px);
    border-top: 1px solid var(--border);
    padding: 14px 20px; z-index: 20;
}
.bar-inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.bar-total { flex: 1; }
.bar-total-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); font-weight: 700; }
.bar-total-value { font-family: var(--mono); font-size: 22px; font-weight: 800; color: var(--accent); }
.place-btn {
    background: linear-gradient(135deg, var(--accent), #14a67a);
    color: #051610; border: none; padding: 14px 22px; border-radius: 12px;
    font-weight: 800; font-size: 14px; letter-spacing: .5px; cursor: pointer;
    transition: transform .1s;
}
.place-btn:disabled { opacity: .4; }
.place-btn:active { transform: scale(.97); }

.empty { padding: 60px 20px; text-align: center; color: var(--text-dim); }
.empty svg { opacity: .3; margin-bottom: 12px; }

/* Status view */
.status-wrap { padding: 30px 20px; }
.status-card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px 20px; text-align: center;
    position: relative; overflow: hidden;
}
.status-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
}
.status-icon {
    width: 72px; height: 72px; margin: 0 auto 16px;
    border-radius: 50%; background: rgba(34,224,161,.15);
    display: grid; place-items: center; color: var(--accent); font-size: 32px;
}
.status-title { font-size: 20px; font-weight: 800; margin-bottom: 6px; }
.status-msg { color: var(--text-dim); font-size: 13px; line-height: 1.5; }

.timeline { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; text-align: left; }
.step {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; background: var(--panel-2); border-radius: 10px;
    border: 1px solid var(--border); opacity: .5;
    transition: opacity .3s, border-color .3s;
}
.step.done { opacity: 1; border-color: var(--accent); }
.step.active { opacity: 1; border-color: var(--warn); animation: pulse 1.6s infinite; }
.step.reject { opacity: 1; border-color: var(--danger); }
@keyframes pulse { 50% { opacity: .7; } }
.step-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--border); display: grid; place-items: center;
    font-family: var(--mono); font-weight: 800; font-size: 12px;
}
.step.done .step-dot { background: var(--accent); color: #051610; }
.step.active .step-dot { background: var(--warn); color: #221600; }
.step.reject .step-dot { background: var(--danger); color: #fff; }
.step-text { flex: 1; font-size: 13px; }

.order-summary { background: var(--panel-2); border-radius: 10px; padding: 14px; margin-top: 20px; text-align: left; }
.order-line {
    display: flex; justify-content: space-between; padding: 6px 0;
    font-size: 13px; font-family: var(--mono);
}
.order-line:not(:last-child) { border-bottom: 1px dashed var(--border); }
.order-total { color: var(--accent); font-weight: 800; font-size: 15px; }

.retry-btn {
    margin-top: 20px; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 12px 20px; border-radius: 10px;
    font-weight: 600; cursor: pointer; width: 100%;
}

.spinner {
    width: 20px; height: 20px; border: 2.5px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; margin: 0 auto;
    animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.footer { text-align: center; color: var(--text-dim); font-size: 10px; padding: 20px; letter-spacing: 2px; }
</style>
</head>

let menu = { items: [], categories: [], partners: [] };
let cart = []; // [{ key, itemId, name, variant, price, qty, partnerId, partnerName, sharePct }]
let selectedVariant = {}; // itemId -> variantIndex (default 0)
let activeCat = 'all';
let activeOrderId = localStorage.getItem('gd_order_' + PC_ID) || null;
let statusPollTimer = null;

function money(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function fetchMenu() {
    try {
        const r = await fetch(API + '/menu', { cache: 'no-store' });
        const data = await r.json();
        menu.items = data.items || [];
        menu.categories = data.categories || [];
        menu.partners = data.partners || [];
    } catch (e) {
        menu = { items: [], categories: [], partners: [] };
    }
    document.getElementById('loading').style.display = 'none';
    if (!menu.items.length) {
        document.getElementById('emptyMenu').style.display = 'block';
        return;
    }
    renderCatBar();
    renderMenu();
    document.getElementById('menuView').style.display = 'block';
    document.getElementById('cartBar').style.display = 'block';
    updateCart();
}

function renderCatBar() {
    const bar = document.getElementById('catBar');
    // Show categories that have at least one item, plus 'All'
    const usedCatIds = new Set(menu.items.map(i => i.categoryId).filter(Boolean));
    const catList = [{ id: 'all', name: 'All' }, ...menu.categories.filter(c => usedCatIds.has(c.id))];
    // Also 'Uncategorized' if any items have no category
    const hasUncat = menu.items.some(i => !i.categoryId);
    if (hasUncat) catList.push({ id: '__none__', name: 'Other' });

    bar.innerHTML = catList.map(c => `
        <div class="cat-chip ${activeCat === c.id ? 'active' : ''}" onclick="switchCat('${c.id}')">${escapeHtml(c.name)}</div>
    `).join('');
    // Hide the bar if only 'All'
    bar.style.display = catList.length > 1 ? '' : 'none';
}

function switchCat(id) {
    activeCat = id;
    renderCatBar();
    renderMenu();
}

function itemPrice(item, variantIdx) {
    if (item.variants && item.variants.length) {
        const v = item.variants[variantIdx || 0];
        return { price: v.price, variantName: v.name };
    }
    return { price: item.price || 0, variantName: '' };
}

function cartKey(itemId, variantName) { return itemId + '::' + (variantName || ''); }

function cartQty(itemId, variantName) {
    const e = cart.find(c => c.key === cartKey(itemId, variantName));
    return e ? e.qty : 0;
}

function renderMenu() {
    const list = document.getElementById('menuList');
    let items = menu.items;
    if (activeCat === '__none__') items = items.filter(i => !i.categoryId);
    else if (activeCat !== 'all') items = items.filter(i => i.categoryId === activeCat);

    if (!items.length) {
        list.innerHTML = '<div class="empty" style="padding:30px;">No items in this category.</div>';
        return;
    }

    list.innerHTML = items.map(item => {
        const hasVariants = item.variants && item.variants.length > 0;
        const vIdx = selectedVariant[item.id] ?? 0;
        const { price, variantName } = itemPrice(item, vIdx);
        const qty = cartQty(item.id, variantName);
        const partner = item.partnerId ? menu.partners.find(p => p.id === item.partnerId) : null;

        let variantsHtml = '';
        if (hasVariants) {
            variantsHtml = `<div class="variants">
                ${item.variants.map((v, i) => `
                    <div class="variant-chip ${i === vIdx ? 'selected' : ''}" onclick="pickVariant('${item.id}', ${i})">
                        <span class="v-name">${escapeHtml(v.name)}</span>
                        <span class="v-price">${money(v.price)}</span>
                    </div>
                `).join('')}
            </div>`;
        }

        return `
            <div class="item ${qty > 0 ? 'active' : ''}">
                <div class="item-top">
                    <div class="item-info">
                        <div class="item-name">${escapeHtml(item.name)}</div>
                        ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ''}
                        ${partner ? `<div class="item-partner">By ${escapeHtml(partner.name)}</div>` : ''}
                        ${!hasVariants ? `<div class="item-price-simple">${money(price)}</div>` : ''}
                    </div>
                </div>
                ${variantsHtml}
                <div class="item-actions">
                    <div class="qty-ctrl">
                        ${qty > 0 ? `
                            <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
                            <div class="qty-num">${qty}</div>
                        ` : ''}
                        <button class="qty-btn add" onclick="changeQty('${item.id}', 1)">+</button>
                    </div>
                </div>
            </div>`;
    }).join('');
}

function pickVariant(itemId, idx) {
    selectedVariant[itemId] = idx;
    renderMenu();
}

function changeQty(itemId, delta) {
    const item = menu.items.find(i => i.id === itemId);
    if (!item) return;
    const vIdx = selectedVariant[itemId] ?? 0;
    const { price, variantName } = itemPrice(item, vIdx);
    const key = cartKey(itemId, variantName);
    const partner = item.partnerId ? menu.partners.find(p => p.id === item.partnerId) : null;
    // Partner cost snapshot (for that variant/item)
    let partnerCost = 0;
    if (partner) {
        if (item.variants && item.variants.length) {
            partnerCost = (item.variants[vIdx] && item.variants[vIdx].partnerCost) || 0;
        } else {
            partnerCost = item.partnerCost || 0;
        }
    }

    let entry = cart.find(c => c.key === key);
    if (!entry) {
        if (delta < 0) return;
        cart.push({
            key, itemId, name: item.name, variant: variantName, price, qty: delta,
            partnerId: partner ? partner.id : null,
            partnerName: partner ? partner.name : '',
            partnerCost
        });
    } else {
        entry.qty += delta;
        if (entry.qty <= 0) cart = cart.filter(c => c !== entry);
    }
    updateCart();
    renderMenu();
}

function updateCart() {
    let count = 0, total = 0;
    for (const c of cart) { count += c.qty; total += c.price * c.qty; }
    document.getElementById('cartCount').textContent = count;
    document.getElementById('cartTotal').textContent = money(total);
    document.getElementById('placeBtn').disabled = count === 0;
}

async function placeOrder() {
    const items = cart.map(c => ({
        name: c.name, variant: c.variant || '',
        price: c.price, qty: c.qty,
        partnerId: c.partnerId, partnerName: c.partnerName || '',
        partnerCost: c.partnerCost || 0
    }));
    if (!items.length) return;
    document.getElementById('placeBtn').disabled = true;
    document.getElementById('placeBtn').textContent = 'Placing...';
    try {
        const r = await fetch(API + '/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ pc_id: PC_ID, pc_name: PC_NAME, items })
        });
        if (!r.ok) throw new Error('Server error');
        const order = await r.json();
        activeOrderId = order.id;
        localStorage.setItem('gd_order_' + PC_ID, order.id);
        cart = [];
        showStatus(order);
    } catch (e) {
        document.getElementById('placeBtn').disabled = false;
        document.getElementById('placeBtn').textContent = 'Place Order →';
        alert('Could not place order. Please try again or ask the staff.');
    }
}

const STATUS_META = {
    pending:   { icon: '⏳', title: 'Order Received!', msg: 'The staff has been notified. They will confirm your order shortly.', color: 'var(--warn)' },
    preparing: { icon: '👨‍🍳', title: 'Preparing Your Order', msg: 'Your food is being prepared. Sit back and enjoy your game!', color: 'var(--info)' },
    delivered: { icon: '✅', title: 'Delivered!', msg: 'Your order has been delivered. Enjoy!', color: 'var(--accent)' },
    rejected:  { icon: '❌', title: 'Order Rejected', msg: 'Sorry, this order could not be accepted. Please talk to the staff.', color: 'var(--danger)' },
};

function showStatus(order) {
    document.getElementById('menuView').style.display = 'none';
    document.getElementById('cartBar').style.display = 'none';
    document.getElementById('emptyMenu').style.display = 'none';
    const view = document.getElementById('statusView');
    view.style.display = 'block';
    const meta = STATUS_META[order.status] || STATUS_META.pending;
    const steps = [{ key:'pending', label:'Order Placed'}, { key:'preparing', label:'Preparing'}, { key:'delivered', label:'Delivered'}];
    const idx = steps.findIndex(s => s.key === order.status);
    const rejected = order.status === 'rejected';

    const itemsHtml = order.items.map(i => `
        <div class="order-line">
            <span>${escapeHtml(i.name)}${i.variant ? ' — ' + escapeHtml(i.variant) : ''} × ${i.qty}</span>
            <span>${money(i.price * i.qty)}</span>
        </div>
    `).join('');

    view.innerHTML = `
        <div class="status-wrap">
            <div class="status-card">
                <div class="status-icon" style="color:${meta.color}; background:${meta.color}22;">${meta.icon}</div>
                <div class="status-title">${meta.title}</div>
                <div class="status-msg">${meta.msg}</div>
                <div class="timeline">
                    ${rejected ? `<div class="step reject"><div class="step-dot">✕</div><div class="step-text">Rejected by staff</div></div>`
                     : steps.map((s, i) => {
                        let cls = '';
                        if (i < idx) cls = 'done';
                        else if (i === idx) cls = i === steps.length - 1 ? 'done' : 'active';
                        return `<div class="step ${cls}"><div class="step-dot">${cls === 'done' ? '✓' : (i+1)}</div><div class="step-text">${s.label}</div></div>`;
                    }).join('')}
                </div>
                <div class="order-summary">
                    ${itemsHtml}
                    <div class="order-line" style="border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px;">
                        <span>Total</span><span class="order-total">${money(order.total)}</span>
                    </div>
                    <div style="font-size:11px; color: var(--text-dim); text-align:center; margin-top:10px; letter-spacing:1px;">Pay at billing · added to your session</div>
                </div>
                ${['delivered','rejected'].includes(order.status)
                    ? `<button class="retry-btn" onclick="resetOrder()">Order Again</button>`
                    : `<div style="font-size:11px; color: var(--text-dim); margin-top: 16px; letter-spacing: 1px; text-transform: uppercase;">Auto-refreshing...</div>`}
            </div>
        </div>`;

    if (!['delivered','rejected'].includes(order.status)) startStatusPoll(order.id);
    else stopStatusPoll();
}

function resetOrder() {
    localStorage.removeItem('gd_order_' + PC_ID);
    activeOrderId = null;
    stopStatusPoll();
    document.getElementById('statusView').style.display = 'none';
    document.getElementById('menuView').style.display = 'block';
    document.getElementById('cartBar').style.display = 'block';
    cart = [];
    updateCart();
    renderMenu();
}

function startStatusPoll(orderId) {
    stopStatusPoll();
    statusPollTimer = setInterval(async () => {
        try {
            const r = await fetch(API + '/orders/' + orderId, { cache: 'no-store' });
            if (!r.ok) return;
            const order = await r.json();
            showStatus(order);
        } catch {}
    }, 3000);
}
function stopStatusPoll() { if (statusPollTimer) { clearInterval(statusPollTimer); statusPollTimer = null; } }

(async function init() {
    await fetchMenu();
    if (activeOrderId) {
        try {
            const r = await fetch(API + '/orders/' + activeOrderId, { cache: 'no-store' });
            if (r.ok) {
                const order = await r.json();
                if (!['delivered','rejected'].includes(order.status) || Date.now() - new Date(order.updated_at).getTime() < 60000) showStatus(order);
                else localStorage.removeItem('gd_order_' + PC_ID);
            }
        } catch {}
    }
})();
</script>
</body>
